name: iOS Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (No Code Signing)
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter 3.41.6
        run: |
          FLUTTER_VERSION="3.41.6"
          curl -fsSL -o flutter.zip \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_VERSION}-stable.zip"
          unzip -q flutter.zip -d $HOME
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
        env:
          LANG: en_US.UTF-8

      - name: Build iOS (no code signing)
        run: flutter build ios --no-codesign --debug
        env:
          LANG: en_US.UTF-8

      - name: Build succeeded
        run: echo "iOS build completed successfully!"
