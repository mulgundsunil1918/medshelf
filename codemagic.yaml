workflows:
  ios-release:
    name: MedShelf iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.medshelf.medshelf
      vars:
        APP_STORE_APPLE_ID: "0000000000"     # numeric Apple ID of your App Store Connect app — fill after first submission
        BUNDLE_ID: "com.medshelf.medshelf"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
      - name: Flutter analyze
        script: flutter analyze lib
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=$(grep -E "^version:" pubspec.yaml | sed 's/version://' | sed 's/+.*//' | xargs) \
            --build-number=$(($(grep -E "^version:" pubspec.yaml | sed 's/.*+//' | xargs))) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
